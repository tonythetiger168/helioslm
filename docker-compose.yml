version: "3.8"

services:
  helioslm-api:
    build: .
    image: helioslm:v4.1
    container_name: helioslm-api
    ports:
      - "8000:8000"
    environment:
      - HELIOSLM_MODEL=helioslm-lite
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    volumes:
      - ./models:/app/models:ro
      - ./checkpoints:/app/checkpoints

  # Optional: Redis for caching
  redis:
    image: redis:7-alpine
    container_name: helioslm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
