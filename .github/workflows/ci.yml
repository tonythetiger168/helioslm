name: HeliosLM CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  syntax-gate:
    # Catches hard breakage cheaply: syntax errors (E9), undefined names
    # (F82), and dead exception paths (F63/F7). This gate would have
    # caught the test_v116_robot.py syntax error that reached main.
    # Rules live in .flake8 (also unused imports/locals, F401/F841/F811/F541).
    name: Syntax Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install flake8==7.4.1
      - run: flake8 evastar/ harness/ agent/
      # v5.132: LF guard. The digest-pinned benchmark/data artifacts hash
      # raw bytes, so a CRLF blob (e.g. a Windows checkout/commit without
      # the v5.110 .gitattributes policy) fails digest gates on content
      # that is actually right. .gitattributes governs future checkouts;
      # this step guards the index itself.
      - name: LF guard
        run: |
          bad=$(git ls-files '*.py' '*.md' '*.json' '*.jsonl' '*.txt' '*.yml' '*.yaml' '*.sh' '*.toml' '*.cfg' '*.ini' '*.csv' '*.tex' | xargs grep -lU $'\r' || true)
          if [ -n "$bad" ]; then echo "CRLF bytes in tracked text files:"; echo "$bad"; exit 1; fi

  test-v5:
    name: Test v5 Suite (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned CPU torch + test deps
        run: pip install -r requirements-ci.txt
      - name: Install optional BPE tokenizer dependency
        run: pip install tokenizers==0.22.1
      # v5.79 (tech-debt Phase 3): one parallel pytest run covers both
      # suites; test_v5_cases.py runs test_v5.py's 93 cases as pytest
      # cases (test_v5.py itself still works as a script). conftest.py
      # pins every xdist worker to one torch thread.
      - name: Test suite (pytest + test_v5 cases, 4 workers)
        run: python -m pytest evastar/tests/ -q -x -n 4 --ignore=evastar/tests/test_v5.py
      - name: Integration test (v5.1 serving stack)
        run: python integration_test_v51.py

  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    needs: [syntax-gate, test-v5]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: |
          zip -r helioslm-v5-release.zip \
            evastar/ harness/ agent/ benchmarks/ docs/ examples/ \
            README.md LICENSE \
            -x "*.zip" "*.pyc" "__pycache__/*" "*.pt"
      - uses: actions/upload-artifact@v4
        with:
          name: helioslm-v5-release
          path: helioslm-v5-release.zip
