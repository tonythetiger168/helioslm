name: HeliosLM CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  syntax-gate:
    # Catches hard breakage cheaply: syntax errors (E9), undefined names
    # (F82), and dead exception paths (F63/F7). This gate would have
    # caught the test_v116_robot.py syntax error that reached main.
    # Rules live in .flake8 (also unused imports/locals, F401/F841/F811/F541).
    name: Syntax Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install flake8==7.4.1
      # Python trees the release zip ships (build-release below), plus
      # serving/ (OpenAI-compatible stream client; pytest covers it, the
      # release zip does not). docs/ has no .py; scripts/ and
      # integration_test_v51.py are not zipped.
      - run: flake8 helioslm_v5/ agent/ benchmarks/ examples/ serving/
      # v5.132: LF guard. The digest-pinned benchmark/data artifacts hash
      # raw bytes, so a CRLF blob (e.g. a Windows checkout/commit without
      # the v5.110 .gitattributes policy) fails digest gates on content
      # that is actually right. .gitattributes governs future checkouts;
      # this step guards the index itself.
      - name: LF guard
        run: |
          bad=$(git ls-files '*.py' '*.md' '*.json' '*.jsonl' '*.txt' '*.yml' '*.yaml' '*.sh' '*.toml' '*.cfg' '*.ini' '*.csv' '*.tex' | xargs grep -lU $'\r' || true)
          if [ -n "$bad" ]; then echo "CRLF bytes in tracked text files:"; echo "$bad"; exit 1; fi

  test-v5:
    name: Test v5 Suite (py${{ matrix.python }})
    runs-on: ubuntu-latest
    # Longest successful test-v5 job in the last 40 ci.yml runs was 9.2 min
    # (py3.12, run 41798881522, 2026-11-04). 20 is a bit over 2x that.
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned CPU torch + test deps
        run: pip install -r requirements-ci.txt
      # v5.147: Icarus Verilog for the HDL bench simulation tests
      # (test_hdl_bench.py skips them when it is absent).
      - name: Install Icarus Verilog
        run: sudo apt-get update -q && sudo apt-get install -y -q iverilog
      - name: Install optional BPE tokenizer dependency
        run: pip install -r requirements-test-extras.txt
      # v5.79 (tech-debt Phase 3): one parallel pytest run covers both
      # suites; test_v5_cases.py runs test_v5.py's 93 cases as pytest
      # cases (test_v5.py itself still works as a script). conftest.py
      # pins every xdist worker to one torch thread.
      - name: Test suite (pytest + test_v5 cases, 4 workers)
        run: python -m pytest helioslm_v5/tests/ -q -n 4 --ignore=helioslm_v5/tests/test_v5.py
      - name: Integration test (v5.1 serving stack)
        run: python integration_test_v51.py
      - name: Wheel install and execution smoke (py3.12)
        if: matrix.python == '3.12'
        run: |
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/wheel"
          python -m pip install --no-deps --target "$RUNNER_TEMP/helioslm-wheel" "$RUNNER_TEMP"/wheel/helioslm-*.whl
          cd "$RUNNER_TEMP"
          HELIOSLM_WHEEL_TARGET="$RUNNER_TEMP/helioslm-wheel" python -I - <<'PY'
          import os
          import sys
          import torch

          sys.path.insert(0, os.environ["HELIOSLM_WHEEL_TARGET"])
          from helioslm_v5.configs.config_v5 import HeliosLMv5Config
          from helioslm_v5.hsh import Context
          from helioslm_v5.hub import CONFIG_FORMAT_VERSION, _serialize_config
          from helioslm_v5.src.model_v5 import HeliosLMv5

          config = HeliosLMv5Config(size="lite", num_hidden_layers=1)
          model = HeliosLMv5(config)
          output = model.generate(torch.tensor([[1, 2]]), max_new_tokens=1,
                                  temperature=0)
          assert output.shape == (1, 3)
          assert _serialize_config(config)["config_format_version"] == CONFIG_FORMAT_VERSION
          assert Context() is not None
          import helioslm_v5.harness.harness_plugins  # noqa: F401
          print("wheel install smoke: imports, config and one-token generation OK")
          PY
      # v5.177: CVDP harnesses are cocotb tests; cocotb is installed only
      # for this step so the main suite runs without it.
      - name: CVDP harness on cocotb + Icarus
        run: |
          pip install -r requirements-cvdp.txt
          python -m pytest -q helioslm_v5/tests/test_cvdp_bench.py

  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    needs: [syntax-gate, test-v5]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: |
          zip -r helioslm-v5-release.zip \
            helioslm_v5/ agent/ benchmarks/ docs/ examples/ \
            README.md LICENSE \
            -x "*.zip" "*.pyc" "__pycache__/*" "*.pt"
      - name: Verify imports from the release archive
        run: |
          unzip -q helioslm-v5-release.zip -d "$RUNNER_TEMP/helios-release"
          cd "$RUNNER_TEMP/helios-release"
          python3 -I -c "import sys; sys.path.insert(0, '.'); from helioslm_v5.configs.config_v5 import HeliosLMv5Config; assert HeliosLMv5Config(size='lite').hidden_size > 0"
      - uses: actions/upload-artifact@v4
        with:
          name: helioslm-v5-release
          path: helioslm-v5-release.zip
