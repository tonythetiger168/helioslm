apiVersion: apps/v1
kind: Deployment
metadata:
  name: helioslm-operator
  namespace: helioslm-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helioslm-operator
  template:
    metadata:
      labels:
        app: helioslm-operator
    spec:
      serviceAccountName: helioslm-operator
      containers:
        - name: operator
          image: helioslm/operator:v1.0.0
          command: ["python", "-m", "deployment.k8s_operator"]
          resources:
            limits:
              cpu: "2"
              memory: "4Gi"
            requests:
              cpu: "1"
              memory: "2Gi"
          env:
            - name: WATCH_NAMESPACE
              value: ""  # Empty = all namespaces
            - name: LOG_LEVEL
              value: "INFO"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: helioslm-operator
  namespace: helioslm-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: helioslm-operator
rules:
  - apiGroups: ["helioslm.io"]
    resources: ["helioslmmodels"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["helioslm.io"]
    resources: ["helioslmmodels/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: helioslm-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: helioslm-operator
subjects:
  - kind: ServiceAccount
    name: helioslm-operator
    namespace: helioslm-system
