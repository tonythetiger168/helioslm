apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: helioslmmodels.helioslm.io
spec:
  group: helioslm.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                modelPath:
                  type: string
                  description: "Path to model checkpoint (S3, GCS, or PVC)"
                modelSize:
                  type: string
                  enum: ["ultra", "pro", "lite", "nano"]
                  default: "ultra"
                replicas:
                  type: integer
                  minimum: 1
                  default: 1
                gpuPerReplica:
                  type: integer
                  minimum: 1
                  default: 8
                memoryPerGpu:
                  type: string
                  default: "80Gi"
                maxBatchSize:
                  type: integer
                  default: 32
                maxSeqLen:
                  type: integer
                  default: 32768
                quantization:
                  type: string
                  enum: ["", "fp8", "int8", "awq", "gptq"]
                tensorParallel:
                  type: integer
                  default: 8
                pipelineParallel:
                  type: integer
                  default: 1
                autoscaling:
                  type: object
                  properties:
                    minReplicas:
                      type: integer
                      default: 1
                    maxReplicas:
                      type: integer
                      default: 10
                    targetGpuUtilization:
                      type: number
                      default: 0.7
                    targetQueueDepth:
                      type: integer
                      default: 10
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "Loading", "Ready", "Failed", "Updating"]
                replicas:
                  type: integer
                readyReplicas:
                  type: integer
                modelLoaded:
                  type: boolean
                lastUpdated:
                  type: string
      additionalPrinterColumns:
        - name: Size
          type: string
          jsonPath: .spec.modelSize
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: integer
          jsonPath: .status.readyReplicas
  scope: Namespaced
  names:
    plural: helioslmmodels
    singular: helioslmmodel
    kind: HeliosLMModel
    shortNames:
      - hlm
