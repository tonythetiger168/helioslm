syntax = "proto3";

package helioslm;

// HeliosLM Inference Service
service HeliosLMService {
  // Single generation request
  rpc Generate(GenerateRequest) returns (GenerateResponse);

  // Streaming generation
  rpc StreamGenerate(GenerateRequest) returns (stream GenerateChunk);

  // Batch generation
  rpc BatchGenerate(BatchGenerateRequest) returns (BatchGenerateResponse);

  // Health check
  rpc Health(HealthRequest) returns (HealthResponse);

  // Get model info
  rpc GetModelInfo(ModelInfoRequest) returns (ModelInfoResponse);
}

message GenerateRequest {
  string model = 1;
  repeated Message messages = 2;
  float temperature = 3;
  float top_p = 4;
  int32 top_k = 5;
  int32 max_tokens = 6;
  bool stream = 7;
  repeated string stop = 8;
  float presence_penalty = 9;
  float frequency_penalty = 10;
  string user = 11;
}

message Message {
  string role = 1;  // system, user, assistant, tool
  string content = 2;
  repeated ToolCall tool_calls = 3;
}

message ToolCall {
  string id = 1;
  string type = 2;
  string function_name = 3;
  string function_arguments = 4;  // JSON string
}

message GenerateResponse {
  string id = 1;
  string object = 2;
  int64 created = 3;
  string model = 4;
  repeated Choice choices = 5;
  Usage usage = 6;
}

message Choice {
  int32 index = 1;
  Message message = 2;
  string finish_reason = 3;
}

message GenerateChunk {
  string id = 1;
  string object = 2;
  int64 created = 3;
  string model = 4;
  ChunkChoice choice = 5;
}

message ChunkChoice {
  int32 index = 1;
  Message delta = 2;  // Only contains new content
  string finish_reason = 3;
}

message Usage {
  int32 prompt_tokens = 1;
  int32 completion_tokens = 2;
  int32 total_tokens = 3;
}

message BatchGenerateRequest {
  repeated GenerateRequest requests = 1;
}

message BatchGenerateResponse {
  repeated GenerateResponse responses = 1;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
  string model = 2;
  float gpu_utilization = 3;
  int32 queue_depth = 4;
}

message ModelInfoRequest {
  string model = 1;
}

message ModelInfoResponse {
  string id = 1;
  string object = 2;
  int64 created = 3;
  string owned_by = 4;
  repeated string permissions = 5;
}
