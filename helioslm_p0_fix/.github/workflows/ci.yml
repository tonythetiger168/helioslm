name: HeliosLM CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install mypy types-pyyaml
      - name: Lint with black
        run: black --check src/ tests/ scripts/
      - name: Lint with flake8
        run: flake8 src/ tests/ scripts/ --max-line-length=120
      - name: Type check with mypy
        run: mypy src/ --ignore-missing-imports
      - name: Run tests
        run: pytest tests/ -v --cov=src --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for dangerous subprocess patterns
        run: |
          if grep -r "subprocess.run" src/ --include="*.py" | grep -v "docker" | grep -v "test_"; then
            echo "Found unsafe subprocess usage outside Docker context"
            exit 1
          fi
          echo "No unsafe subprocess patterns found"
      - name: Bandit security scan
        run: |
          pip install bandit
          bandit -r src/ -f json -o bandit-report.json || true
          bandit -r src/ || true
