name: HeliosLM CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  syntax-gate:
    # Catches hard breakage cheaply: syntax errors (E9), undefined names
    # (F82), and dead exception paths (F63/F7). This gate would have
    # caught the test_v116_robot.py syntax error that reached main.
    name: Syntax Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install flake8
      - run: flake8 helioslm_v5/ harness/ agent/ --select=E9,F63,F7,F82

  test-v5:
    name: Test v5 Suite (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU torch
        run: pip install torch pytest --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: Unit + regression suite (test_v5.py)
        run: python helioslm_v5/tests/test_v5.py
      - name: Pytest suite (harness/agent/inference)
        run: python -m pytest helioslm_v5/tests/ -q -x --ignore=helioslm_v5/tests/test_v5.py
      - name: Integration test (v5.1 serving stack)
        run: python integration_test_v51.py

  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    needs: [syntax-gate, test-v5]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: |
          zip -r helioslm-v5-release.zip \
            helioslm_v5/ harness/ agent/ benchmarks/ docs/ examples/ \
            README.md CHANGELOG.md LICENSE \
            -x "*.zip" "*.pyc" "__pycache__/*" "*.pt"
      - uses: actions/upload-artifact@v4
        with:
          name: helioslm-v5-release
          path: helioslm-v5-release.zip
