apiVersion: apps/v1
kind: Deployment
metadata:
  name: helioslm-api
  labels:
    app: helioslm-api
    version: v4.1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: helioslm-api
  template:
    metadata:
      labels:
        app: helioslm-api
        version: v4.1
    spec:
      containers:
      - name: helioslm
        image: helioslm:v4.1
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: HELIOSLM_MODEL
          value: "helioslm-lite"
        - name: CUDA_VISIBLE_DEVICES
          value: "0"
        resources:
          limits:
            nvidia.com/gpu: 1
            memory: "32Gi"
            cpu: "8"
          requests:
            memory: "16Gi"
            cpu: "4"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        volumeMounts:
        - name: model-storage
          mountPath: /app/models
          readOnly: true
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: helioslm-models-pvc
      nodeSelector:
        accelerator: nvidia-tesla-a100
---
apiVersion: v1
kind: Service
metadata:
  name: helioslm-api-service
spec:
  selector:
    app: helioslm-api
  ports:
  - port: 80
    targetPort: 8000
    name: http
  type: LoadBalancer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: helioslm-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: helioslm-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
